name: Package and Publish VS Code Extension

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package to the VS Code Marketplace
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      tag: v${{ steps.package-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: current

      - name: Check extension syntax
        run: npm run check

      - name: Read package version
        id: package-version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="${{ steps.package-version.outputs.version }}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version."
            exit 1
          fi

      - name: Package extension
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: mysql-cnf-formatter-vsix
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: Publish Marketplace and Release
    needs: package
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: current

      - name: Download packaged VSIX
        uses: actions/download-artifact@v6
        with:
          name: mysql-cnf-formatter-vsix
          path: dist

      - name: Check whether package tag already exists
        id: release-tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tag="${{ needs.package.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists; skipping Marketplace publish and GitHub release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') || steps.release-tag.outputs.exists != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "The VSCE_PAT repository secret is required to publish."
            exit 1
          fi
          vsix_path="$(ls dist/*.vsix | head -n 1)"
          npx --yes @vscode/vsce publish --packagePath "$vsix_path" --pat "$VSCE_PAT"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || steps.release-tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.package.outputs.tag }}
          generate_release_notes: true
          files: dist/*.vsix

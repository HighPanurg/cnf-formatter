name: Package and Publish VS Code Extension

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package to the VS Code Marketplace
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: current

      - name: Check extension syntax
        run: npm run check

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version."
            exit 1
          fi

      - name: Package extension
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: mysql-cnf-formatter-vsix
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: Publish Marketplace
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download packaged VSIX
        uses: actions/download-artifact@v6
        with:
          name: mysql-cnf-formatter-vsix
          path: dist

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "The VSCE_PAT repository secret is required to publish."
            exit 1
          fi
          vsix_path="$(ls dist/*.vsix | head -n 1)"
          npx --yes @vscode/vsce publish --packagePath "$vsix_path" --pat "$VSCE_PAT"

      - name: Attach VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
